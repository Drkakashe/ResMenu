name: Manual CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Display deployment info
        run: |
          echo "=== Deployment Information ==="
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Author: $(git log -1 --pretty=format:'%an')"
          echo "Message: $(git log -1 --pretty=format:'%s')"
          echo "=============================="

      - name: Check required secrets
        run: |
          echo "SERVER_IP:      ${SERVER_IP:-<empty>}"
          echo "SERVER_USER:    ${SERVER_USER:-<empty>}"
          echo "SERVER_PATH:    ${SERVER_PATH:-<empty>}"
          echo "DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL:+<set>}${DISCORD_WEBHOOK_URL:-<empty>}"
          # Don't print the password value for safety
          if [ -z "$SERVER_IP" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_PASSWORD" ]; then
            echo "❌ One or more required secrets are missing (SERVER_IP / SERVER_USER / SERVER_PASSWORD)."
            exit 1
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️  DISCORD_WEBHOOK_URL secret is not set. Discord notifications will be skipped."
          fi

      # ---------- Backend (.NET) ----------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: |
          cd backend
          dotnet restore Menufy.sln

      - name: Build backend
        run: |
          cd backend
          dotnet build Menufy.sln -c Release --no-restore

      - name: Publish backend API
        run: |
          cd backend
          dotnet publish src/Menufy.API/Menufy.API.csproj -c Release -o ../publish-backend
          ls -la ../publish-backend

      # ---------- Frontend (Node / Nuxt) ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
          ls -la .output

      # ---------- Prepare deploy archive ----------
      - name: Create deploy archive
        run: |
          # We are in repo root here
          tar czf deploy.tar.gz publish-backend frontend/.output
          ls -la
          echo "Archive ready: deploy.tar.gz"

      # ---------- Server connection & deploy via Docker ----------
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy and run with Docker on server
        run: |
          # Copy archive to server
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no deploy.tar.gz "$SERVER_USER@$SERVER_IP:/tmp/resmenu_deploy.tar.gz"

          # Use SERVER_PATH from secret, or default to /etc/vhost/menufy
          DEPLOY_PATH="${SERVER_PATH:-/etc/vhost/menufy}"
          echo "Deploying to: $DEPLOY_PATH"

          # On server: extract + ensure Docker + run containers
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" bash << EOF
          set -e
          DEPLOY_PATH="$DEPLOY_PATH"
          echo "[*] Using DEPLOY_PATH: \$DEPLOY_PATH"

          mkdir -p "\$DEPLOY_PATH"

          echo "[*] Extracting new build..."
          tar xzf /tmp/resmenu_deploy.tar.gz -C "\$DEPLOY_PATH"

          echo "[*] Ensuring Docker is installed..."
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
            systemctl enable --now docker
          fi

          echo "[*] Stopping old containers (if any)..."
          docker rm -f menufy-backend || true
          docker rm -f menufy-frontend || true

          echo "[*] Starting backend container..."
          docker run -d \
            --name menufy-backend \
            --restart=always \
            -p 5000:5000 \
            -v "\$DEPLOY_PATH/publish-backend:/app" \
            -w /app \
            mcr.microsoft.com/dotnet/aspnet:8.0 \
            dotnet Menufy.API.dll

          echo "[*] Starting frontend container..."
          # frontend extracted as \$DEPLOY_PATH/frontend/.output
          docker run -d \
            --name menufy-frontend \
            --restart=always \
            -p 3000:3000 \
            -v "\$DEPLOY_PATH/frontend:/app" \
            -w /app \
            node:20 \
            node .output/server/index.mjs

          echo "[*] Containers running:"
          docker ps
          EOF

      - name: Done
        run: |
          DEPLOY_PATH="${SERVER_PATH:-/etc/vhost/menufy}"
          echo "✅ Deployed to: $DEPLOY_PATH"

      # ---------- Discord Notifications ----------
      - name: Notify Discord on Success
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g' || echo "N/A")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" | sed 's/"/\\"/g' || echo "N/A")
          COMMIT_SHA=$(git rev-parse --short HEAD || echo "N/A")
          BRANCH=$(git rev-parse --abbrev-ref HEAD || echo "N/A")
          
          if [ -n "$FRONTEND_URL" ]; then
            FRONTEND_VALUE="[Visit Site]($FRONTEND_URL)"
          else
            FRONTEND_VALUE="N/A"
          fi
          
          JSON_PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "✅ Deployment Successful",
              "description": "Build and deployment completed successfully!",
              "color": 3066993,
              "fields": [
                {
                  "name": "Branch",
                  "value": "$BRANCH",
                  "inline": true
                },
                {
                  "name": "Commit",
                  "value": "\`$COMMIT_SHA\`",
                  "inline": true
                },
                {
                  "name": "Author",
                  "value": "$COMMIT_AUTHOR",
                  "inline": true
                },
                {
                  "name": "Message",
                  "value": "$COMMIT_MSG",
                  "inline": false
                },
                {
                  "name": "Server",
                  "value": "$SERVER_IP",
                  "inline": true
                },
                {
                  "name": "Frontend",
                  "value": "$FRONTEND_VALUE",
                  "inline": true
                },
                {
                  "name": "Workflow",
                  "value": "[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": true
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": {
                "text": "GitHub Actions"
              }
            }]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON_PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on Failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g' || echo "N/A")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" | sed 's/"/\\"/g' || echo "N/A")
          COMMIT_SHA=$(git rev-parse --short HEAD || echo "N/A")
          BRANCH=$(git rev-parse --abbrev-ref HEAD || echo "N/A")
          
          if [ -n "$FRONTEND_URL" ]; then
            FRONTEND_VALUE="[Visit Site]($FRONTEND_URL)"
          else
            FRONTEND_VALUE="N/A"
          fi
          
          JSON_PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "❌ Deployment Failed",
              "description": "Build or deployment encountered an error!",
              "color": 15158332,
              "fields": [
                {
                  "name": "Branch",
                  "value": "$BRANCH",
                  "inline": true
                },
                {
                  "name": "Commit",
                  "value": "\`$COMMIT_SHA\`",
                  "inline": true
                },
                {
                  "name": "Author",
                  "value": "$COMMIT_AUTHOR",
                  "inline": true
                },
                {
                  "name": "Message",
                  "value": "$COMMIT_MSG",
                  "inline": false
                },
                {
                  "name": "Frontend",
                  "value": "$FRONTEND_VALUE",
                  "inline": true
                },
                {
                  "name": "Workflow",
                  "value": "[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": {
                "text": "GitHub Actions"
              }
            }]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON_PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"